    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="portfolio-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Anton&family=Caveat:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />

    <title>Sumit Panchal - Quality Assurance Portfolio</title>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <noscript>This portfolio requires JavaScript to display its interactive sections.</noscript>

    <div id="root">
      <div class="boot-loading">Sumit Panchal · Senior Quality Assurance Portfolio</div>
    </div>

    <script>
      (function () {
        var root = document.getElementById('root');
        var fontLink = document.getElementById('portfolio-fonts');

        function showLoadingScreen() {
          if (!root) return;
          root.classList.add('fonts-ready');
        }

        function loadPortfolioFont() {
          if (!document.fonts || !document.fonts.load) {
            showLoadingScreen();
            return;
          }

          document.fonts.load('400 50px "Allura"')
            .then(function () {
              return document.fonts.ready;
            })
            .then(function () {
              showLoadingScreen();
            })
            .catch(function () {
              showLoadingScreen();
            });
        }

        if (fontLink) {
          if (fontLink.sheet) {
            loadPortfolioFont();
          } else {
            fontLink.addEventListener('load', loadPortfolioFont, { once: true });
            fontLink.addEventListener('error', showLoadingScreen, { once: true });
          }
        } else {
          showLoadingScreen();
        }

        function showStartupError(message) {
          if (!root || !root.querySelector('.boot-loading')) return;

          var panel = document.createElement('main');
          panel.className = 'boot-error';

          var kicker = document.createElement('p');
          kicker.className = 'boot-error-kicker';
          kicker.textContent = 'PORTFOLIO STARTUP ERROR';

          var heading = document.createElement('h1');
          heading.textContent = 'The portfolio could not finish loading.';

          var help = document.createElement('p');
          help.textContent = 'Check the Vite terminal for the first module or dependency error, then refresh.';

          var details = document.createElement('pre');
          details.textContent = message || 'A JavaScript module failed to load.';

          panel.append(kicker, heading, help, details);
          root.replaceChildren(panel);
        }

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var moduleFailed = target && target.tagName === 'SCRIPT' && target.type === 'module';

          if (event && (event.error || event.message || moduleFailed)) {
            showStartupError(
              event.message ||
              (target && target.src
                ? 'Failed to load module: ' + target.src
                : 'A JavaScript module failed to load.')
            );
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          showStartupError(
            event && event.reason
              ? String(event.reason.message || event.reason)
              : 'An unhandled promise rejection occurred.'
          );
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
